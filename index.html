<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>عدسة — الخط الزمني للذكاء الاصطناعي</title>
  <meta name="description" content="AI evolves at breakneck speed. AI Lens tracks the acceleration in real time—mapping every major model release, research breakthrough, and industry milestone on a single interactive timeline.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="page-timeline">
  <header class="top">
    <a class="brand" data-nav="./" href="./">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--c-models)"/><stop offset=".33" stop-color="var(--c-products)"/>
          <stop offset=".66" stop-color="var(--c-research)"/><stop offset="1" stop-color="var(--c-society)"/>
        </linearGradient></defs>
        <circle cx="21" cy="21" r="14" fill="none" stroke="url(#spec)" stroke-width="4"/>
        <path d="M31.5 31.5 L43 43" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <circle cx="21" cy="21" r="4" fill="currentColor"/>
      </svg>
      <span class="brand-name"><b data-i18n="brand">عدسة</b><small>AI · LENS</small></span>
    </a>
    <nav class="tabs" aria-label="pages">
      <a data-nav="./" href="./" aria-current="page" data-i18n="navTimeline">الخط الزمني</a>
      <a data-nav="invest.html" href="invest.html" data-i18n="navInvest">الاستثمارات</a>
      <a data-nav="news.html" href="news.html"  data-i18n="navNews">آخر الأخبار</a>
      <a data-nav="reflections.html" href="reflections.html" data-i18n="navReflections">خواطر</a>
    </nav>
    <div class="today"><span id="dateG"></span><span id="dateH" class="hijri"></span></div>
    <div class="actions">
      <button id="langBtn" class="icon-btn lang" type="button">EN</button>
      <button id="themeBtn" class="icon-btn" type="button" data-i18n-label="themeLabel">☀</button>
    </div>
  </header>

  <section class="hero">
    <h1 data-i18n="heroTimeline"></h1>
    <p class="sub" data-i18n="subTimeline"></p>
  </section>

  <section class="filters" aria-label="filters">
    <div class="frow"><span class="flabel" data-i18n="catLabel"></span><div id="catChips" class="chips" role="group" data-i18n-label="catLabel"></div></div>
    <div class="frow"><span class="flabel" data-i18n="jumpLabel"></span><div id="jumpChips" class="chips"></div></div>
    <div class="toolbar">
      <input id="search" class="search" type="search" data-i18n-ph="search" data-i18n-label="search" autocomplete="off">
      <p class="stats"><b id="count"></b></p>
    </div>
  </section>

  <main>
    <section id="snake" class="snake">
      <svg id="snakeSvg" class="snake-svg" aria-hidden="true"></svg>
      <div id="futureTag" class="snake-tag future-tag" hidden><b data-i18n="future"></b><span data-i18n="whatsNext"></span></div>
      <ol id="snakeGrid" class="snake-grid"></ol>
      <div id="originTag" class="snake-tag origin-tag" hidden><b>1950</b><span data-i18n="origin"></span></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-row"><button id="sourcesBtn" class="btn small" type="button"></button><span id="sourcesNote" class="muted"></span></div>
    
    <p class="muted" data-i18n="credits"></p>
    <p class="muted" data-i18n="footer"></p>
    <p class="muted repo-link"><a href="https://github.com/maghrebme/ai-lens" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span data-i18n="repoLink">المشروع مفتوح المصدر على GitHub</span></a></p>
  </footer>
  <button id="toTop" class="to-top" type="button" data-i18n-label="toTop" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <script type="module" src="assets/js/timeline.js"></script>
</body>
</html>
