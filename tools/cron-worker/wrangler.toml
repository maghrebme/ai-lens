name = "ai-lens-cron"
main = "worker.js"
compatibility_date = "2026-10-01"
# Cron triggers only: no public URL.
workers_dev = false
preview_urls = false

[triggers]
# 00:00 and 12:00 UTC (GMT): news build. Mondays 04:00 UTC: weekly milestone check.
# Cloudflare numbers weekdays from 1 = Sunday, so the day is named, not numbered.
crons = ["0 0,12 * * *", "0 4 * * MON"]

[observability]
enabled = true
